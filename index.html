<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovra PJ — Controle financeiro para autônomos</title>
<style>
:root {
  --bg:#080c14; --s1:#0f1520; --s2:#161e2e; --s3:#1d2840;
  --acc:#f59e0b; --acc2:rgba(245,158,11,.1); --acc-b:rgba(245,158,11,.28);
  --green:#10b981; --green2:rgba(16,185,129,.08); --green-b:rgba(16,185,129,.25);
  --red:#f87171;   --red2:rgba(248,113,113,.08);  --red-b:rgba(248,113,113,.25);
  --gold:#f59e0b;  --gold2:rgba(245,158,11,.08);  --gold-b:rgba(245,158,11,.25);
  --blue:#38bdf8;  --blue2:rgba(56,189,248,.08);  --blue-b:rgba(56,189,248,.25);
  --clt:#818cf8;   --clt2:rgba(129,140,248,.08);  --clt-b:rgba(129,140,248,.25);
  --txt:#e2e8f0; --muted:#64748b; --border:#1a2540; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
input,select{background:var(--s3);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px;font-size:13px;outline:none;transition:border .15s;width:100%}
input:focus,select:focus{border-color:var(--acc)}
button{cursor:pointer}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.top-bar{background:var(--s1);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:12px;flex-wrap:wrap}
.tabs-wrap{background:var(--s1);border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto}
.tabs{display:flex;gap:2px;padding:8px 0;white-space:nowrap}
.tab{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:transparent;transition:.15s}
.tab.active{background:var(--acc2);color:var(--acc);border:1px solid var(--acc-b)}
.main{padding:16px;max-width:680px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row label{font-size:12px;color:var(--muted)}
.neg{color:var(--red)} .pos{color:var(--green)}
.sep{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border)}
.rbox{border-radius:8px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.rbox .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rbox .val{font-size:18px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border-radius:10px;padding:14px 16px}
.kpi .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.kpi .val{font-size:19px;font-weight:800}
.kpi .sub{font-size:10px;color:var(--muted);margin-top:3px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--green-b);color:var(--green);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;animation:fi .3s;white-space:nowrap}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.cat-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--s2);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:.15s}
.cat-chip:hover,.cat-chip.sel{background:var(--acc2);border-color:var(--acc-b);color:var(--txt)}
.prog-bar{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:4px;transition:width .6s}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useMemo, useEffect, useRef, useCallback } = React;
const R  = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const Rk = v => v>=1000?`R$${(v/1000).toFixed(1)}k`:R(v);
const n  = v => parseFloat(String(v).replace(',','.'))||0;
const uid = () => Math.random().toString(36).slice(2,8);
const expKey = (y,m) => `${y}-${m}`;
const MONTHS   = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MONTHS_F = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const today = new Date();

const CATS = [
  {id:'moradia',    icon:'🏠',label:'Moradia',    kw:['aluguel','condominio','iptu','financiamento imovel','luz','agua','internet','gas encanado','cemig','copasa','sabesp','comgas','enel','energisa','vivo fibra','claro','oi fibra','tim fixo','net combo','sindico']},
  {id:'alimentacao',icon:'🍔',label:'Alimentação', kw:['ifood','rappi','mercado','supermercado','padaria','restaurante','lanche','delivery','atacadao','assai','carrefour','extra','pao de acucar','hortifruti','cozinha','acougue','pizzaria','hamburger','sushi','lanchonete','bar ','boteco','churrascaria','outback','mcdonalds','mcdonald','burguer','subway','giraffas','madero','coco bambu']},
  {id:'transporte', icon:'🚗',label:'Transporte',  kw:['uber','99app','99 taxi','cabify','combustivel','gasolina','onibus','metro','estacionamento','carro','posto ','shell','ipiranga','br distrib','transporte','passagem','bilhete','rodoviaria','aeroporto','gol viag','latam','azul linhas','voe','embarque','taxi','rideshare']},
  {id:'saude',      icon:'💊',label:'Saúde',       kw:['farmacia','drogaria','droga','ultrafarma','pacheco','pague menos','remedios','medico','consulta','exame','plano saude','academia','dentista','clinica','hospital','laboratorio','convenio','bradesco saude','amil','unimed','hapvida','gndi','smart fit','smartfit','bluefit','bio ritmo','biolab','fleury','dasa','lavoisier']},
  {id:'educacao',   icon:'🎓',label:'Educação',    kw:['faculdade','curso','escola','livro','udemy','alura','mensalidade','matricula','colegio','universidade','usp','fgv','insper','senac','sebrae','descomplica','stoodi','amazon kindle','submarino livros']},
  {id:'lazer',      icon:'🎬',label:'Lazer',       kw:['cinema','teatro','viagem','hotel','passeio','show ','festival','evento','parque','ingresso','trip advisor','booking','airbnb','decathlon','centauro','netshoes','olympikus','sport']},
  {id:'assinaturas',icon:'📱',label:'Assinaturas', kw:['netflix','spotify','amazon prime','disney','youtube','apple','globo','premiere','deezer','hbo','max ','paramount','star+','crunchyroll','twitch','adobe','microsoft 365','office 365','dropbox','google one','icloud','canva','slack','notion','figma','linear']},
  {id:'dividas',    icon:'💳',label:'Dívidas',     kw:['parcela','emprestimo','financiamento','credito','fatura','nubank','itau','bradesco','santander','caixa','banco do brasil','inter','c6 bank','neon','next','pagbank','picpay','sicoob','sicredi','cartao']},
  {id:'outros',     icon:'📦',label:'Outros',      kw:[]},
];
function norm(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ');
}
function detectCat(lbl) {
  const l = norm(lbl);
  for(const c of CATS){ if(c.kw.some(k=>l.includes(norm(k)))) return c.id; }
  return 'outros';
}
function cleanDesc(raw) {
  if (!raw) return '';
  let s = raw.trim();
  s = s.replace(/\s+\d{6,}$/,'').replace(/\s+\*\w+\s+\d+$/,'');
  s = s.replace(/\*/g,' ');
  s = s.replace(/^(PIX ENVIADO|PIX RECEBIDO|PIX AGENDADO|TED ENVIADO|TED RECEBIDO|DOC ENVIADO|PAGAMENTO PIX|PAGTO PIX|TRANSF PIX|COMPRA DEBITO|COMPRA CREDITO|DEBITO AUTOMATICO|DEB AUT|PAGAMENTO|PAGTO)\s+/i,'');
  s = s.replace(/\b\w+/g, w => {
    const keep = ['cpf','cnpj','pix','ted','doc','cdb','lci','lca','fii'];
    return keep.includes(w.toLowerCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  });
  return s.trim();
}
function splitCSVLine(l) {
  const out=[]; let cur='', inQ=false;
  for(const ch of l){
    if(ch==='"'){inQ=!inQ;}
    else if((ch===','||ch===';')&&!inQ){out.push(cur.trim().replace(/^"|"$/g,''));cur='';}
    else cur+=ch;
  }
  out.push(cur.trim().replace(/^"|"$/g,''));
  return out;
}
function parseNubankCSV(text) {
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2) return [];
  const raw = lines.map(splitCSVLine);
  const ncols = raw[0].length;
  if(ncols<2) return [];
  const header = raw[0].map(h=>norm(h));
  const idx = (...kws) => header.findIndex(h=>kws.some(k=>h.includes(norm(k))));
  // Detect description column
  let descI = idx('descricao','historico','lancamento','estabelecimento','favorecido','beneficiario','nome','memo','titulo','title','detalhe','complemento','comercio','empresa');
  if(descI<0){
    const scores = Array.from({length:ncols},(_,ci)=>raw.slice(1).reduce((s,r)=>s+(r[ci]||'').replace(/[\d\/\.\,\-\s]/g,'').length,0));
    descI = scores.indexOf(Math.max(...scores));
  }
  // Detect value column
  const saldoI = idx('saldo','balance');
  let valI = idx('debito','debit','saida','gasto','despesa');
  if(valI<0) valI = idx('valor','value','amount','montante','vlr','quantia');
  if(valI<0) valI = idx('credito','credit','entrada','receita');
  if(valI<0){
    for(let ci=0;ci<ncols;ci++){
      if(ci===descI||ci===saldoI) continue;
      const nums=raw.slice(1).filter(r=>{const v=(r[ci]||'').replace(/[R$\s\.]/g,'').replace(',','.');return !isNaN(parseFloat(v))&&parseFloat(v)>0;}).length;
      if(nums>raw.length*0.4){valI=ci;break;}
    }
  }
  if(valI<0) return null; // sinaliza erro
  const dateI = idx('data','date','dt','vencimento','competencia','periodo');
  // Detect number format
  const sampleVals = raw.slice(1,6).map(r=>(r[valI]||'').replace(/[R$\s]/g,''));
  const brFormat = sampleVals.some(v=>v.includes(','));
  const parseAmt = s => {
    let v=(s||'').replace(/[R$\s\(\)]/g,'').replace(/^-/,'').trim();
    if(!v) return 0;
    if(brFormat){v=v.replace(/\./g,'').replace(',','.');}
    else{v=v.replace(/,/g,'');}
    return Math.abs(parseFloat(v)||0);
  };
  return raw.slice(1).map((cols,i)=>{
    const val=parseAmt(cols[valI]);
    if(val<=0) return null;
    const rawDesc=(cols[descI]||'').trim();
    const desc=cleanDesc(rawDesc)||('Item '+(i+1));
    const date=dateI>=0?(cols[dateI]||'').trim():'';
    return {id:uid(),label:desc,value:String(val),cat:detectCat(rawDesc+' '+desc),date};
  }).filter(Boolean);
}

// ── Cálculos CLT (para quem tem os dois) ─────────────────────────────────────
function calcINSS(sal) {
  const s=n(sal); if(s<=0) return 0;
  const f=[[1412,.075],[2666.68,.09],[4000.03,.12],[7786.02,.14]];
  let tot=0,prev=0;
  for(const [teto,aliq] of f){if(s<=prev)break;tot+=(Math.min(s,teto)-prev)*aliq;prev=teto;if(s<=teto)break;}
  return tot;
}
function calcIRPF(base) {
  const b=n(base); if(b<=0) return 0;
  const f=[[2259.2,0,0],[2826.65,.075,169.44],[3751.05,.15,381.44],[4664.68,.225,662.77],[Infinity,.275,896]];
  for(const [teto,aliq,ded] of f){if(b<=teto)return Math.max(0,b*aliq-ded);}
  return 0;
}

// ── Cálculos PJ ──────────────────────────────────────────────────────────────
function calcSimples(fatMensal) {
  const fm=n(fatMensal); if(fm<=0) return {aliq:0,imposto:0,nominal:0};
  const fat12=fm*12;
  const faixas=[[180000,.060,0],[360000,.112,9360],[720000,.135,17640],[1440000,.160,35640],[2160000,.210,125640],[Infinity,.330,648000]];
  let nominal=.060,deducao=0;
  for(const [teto,aliq,ded] of faixas){if(fat12<=teto){nominal=aliq;deducao=ded;break;}}
  const efetiva=Math.max(0,(fat12*nominal-deducao)/fat12);
  return {aliq:efetiva, imposto:fm*efetiva, nominal};
}
function calcINSSPJ(proLabore) {
  const p=n(proLabore); if(p<=0) return 0;
  return Math.min(p*.20, 7786.02*.20);
}
function calcProvisoes(proLabore) {
  const p=n(proLabore);
  const prov13=p/12, provFer=(p*4/3)/12;
  return {prov13, provFer, total:prov13+provFer};
}

// ── Derivar dados de um mês ──────────────────────────────────────────────────
function deriveMes(cltBruto, pjByYM, expByYM, invByYM, y, m) {
  const mk=expKey(y,m);
  const pj=pjByYM[mk]||{};
  const fat  =n(pj.fatMensal||0);
  const pl   =n(pj.proLabore||0);
  const dist =n(pj.distribuicao||0);
  const dp   =(pj.despPJ||[]).reduce((s,d)=>s+n(d.value),0);
  const simp =calcSimples(fat);
  const inssPJ=calcINSSPJ(pl);
  const irpfPJ=calcIRPF(pl-inssPJ);
  const prov  =calcProvisoes(pl);
  const liquidoPJ=fat-simp.imposto-inssPJ-irpfPJ-prov.total-dp+dist;
  const cltI =calcINSS(cltBruto), cltR=calcIRPF(n(cltBruto)-cltI), cltL=n(cltBruto)-cltI-cltR;
  const rendaDisp=cltL+liquidoPJ;
  const gastos =(expByYM[mk]||[]).reduce((s,e)=>s+n(e.value),0);
  const invests=(invByYM[mk]||[]).reduce((s,i)=>s+n(i.value),0);
  const sobra  =rendaDisp-gastos-invests;
  const impostos=(cltI+cltR)+(simp.imposto+inssPJ+irpfPJ);
  const rendaBruta=n(cltBruto)+fat;
  return {fat,pl,dist,dp,simp,inssPJ,irpfPJ,prov,liquidoPJ,cltI,cltR,cltL,rendaDisp,gastos,invests,sobra,impostos,rendaBruta};
}

// ── MonthNav ─────────────────────────────────────────────────────────────────
function MonthNav({month,year,onPrev,onNext,style={}}) {
  return React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:10,...style}},
    React.createElement('button',{onClick:onPrev,style:{background:'var(--s2)',border:'1px solid var(--border)',color:'var(--muted)',borderRadius:8,width:30,height:30,fontSize:15,display:'flex',alignItems:'center',justifyContent:'center'}},'‹'),
    React.createElement('span',{style:{fontSize:14,fontWeight:700,minWidth:145,textAlign:'center'}},`${MONTHS_F[month]} ${year}`),
    React.createElement('button',{onClick:onNext,style:{background:'var(--s2)',border:'1px solid var(--border)',color:'var(--muted)',borderRadius:8,width:30,height:30,fontSize:15,display:'flex',alignItems:'center',justifyContent:'center'}},'›')
  );
}

// ── Tab: Início ───────────────────────────────────────────────────────────────
function TabInicio({month,year,onPrev,onNext,cltBruto,pjByYM,expByYM,invByYM,metas,setTab}) {
  const d=deriveMes(cltBruto,pjByYM,expByYM,invByYM,year,month);
  const hasPJ=d.fat>0, hasCLT=n(cltBruto)>0;

  const hist=useMemo(()=>[-3,-2,-1].map(delta=>{
    let m=month+delta,y=year; while(m<0){m+=12;y--;}
    const h=deriveMes(cltBruto,pjByYM,expByYM,invByYM,y,m);
    return {fat:h.fat,gastos:h.gastos};
  }),[month,year,cltBruto,pjByYM,expByYM,invByYM]);

  const histFat  =hist.filter(h=>h.fat>0);
  const histGast =hist.filter(h=>h.gastos>0);
  const avgFat   =histFat.length?histFat.reduce((s,h)=>s+h.fat,0)/histFat.length:0;
  const avgGastos=histGast.length?histGast.reduce((s,h)=>s+h.gastos,0)/histGast.length:0;
  const trendUp  =histFat.length>=2&&d.fat>histFat[histFat.length-1].fat*1.05;
  const trendDown=histFat.length>=2&&d.fat<histFat[histFat.length-1].fat*0.95;
  const trendGastUp=histGast.length>=2&&d.gastos>histGast[histGast.length-1].gastos*1.10;

  const renda=Math.max(d.rendaDisp,1), bruta=Math.max(d.rendaBruta,1);
  const savePct  =(d.sobra+d.invests)/renda;
  const expRatio =d.gastos/renda;
  const invRatio =d.invests/renda;
  const cargaPct =d.rendaBruta>0?d.impostos/bruta:0;
  const margemPJ =d.fat>0?(d.fat-d.simp.imposto-d.inssPJ-d.irpfPJ-d.dp)/d.fat:0;
  const provOk   =!hasPJ||(d.prov.total>0&&d.pl>0);
  const metasDone=metas.filter(m=>n(m.atual)>=n(m.alvo)).length;

  // Score PJ (7 componentes, max 100)
  const s1=d.fat>0?(margemPJ>=.60?22:margemPJ>=.50?17:margemPJ>=.40?11:margemPJ>=.30?6:2):0;
  const s2=cargaPct<=.15?18:cargaPct<=.22?13:cargaPct<=.30?8:d.rendaBruta>0?3:0;
  const s3=!hasPJ?9:provOk?15:0;
  const s4=expRatio<=.50?15:expRatio<=.65?11:expRatio<=.80?7:d.rendaDisp>0?3:0;
  const s5=invRatio>=.20?12:invRatio>=.10?8:invRatio>=.05?4:invRatio>0?1:0;
  const s6=d.rendaDisp===0?5:trendUp?8:!trendDown&&histFat.length>0?5:trendDown?1:4;
  const s7=hasCLT&&hasPJ?10:hasPJ?6:hasCLT?3:0;
  const score=s1+s2+s3+s4+s5+s6+s7;

  const sLabel=score>=85?'Excelente':score>=70?'Muito bom':score>=55?'Bom':score>=40?'Regular':'Atenção';
  const sColor=score>=85?'#10b981':score>=70?'#f59e0b':score>=55?'#38bdf8':score>=40?'#f59e0b':'#f87171';
  const sBg=score>=85?'rgba(16,185,129,.07)':score>=70?'rgba(245,158,11,.07)':score>=55?'rgba(56,189,248,.07)':score>=40?'rgba(245,158,11,.07)':'rgba(248,113,113,.07)';
  const sBd=score>=85?'rgba(16,185,129,.22)':score>=70?'rgba(245,158,11,.22)':score>=55?'rgba(56,189,248,.22)':score>=40?'rgba(245,158,11,.22)':'rgba(248,113,113,.22)';
  const r=52,cx=64,cy=64,circ=2*Math.PI*r,dash=circ*(1-score/100);
  const bc=r=>r>=0.7?'var(--green)':r>=0.4?'var(--gold)':'var(--red)';

  const comps=[
    ['Margem líquida PJ',        s1,22,d.fat>0?`${Math.round(margemPJ*100)}% do faturamento`:'Sem faturamento'],
    ['Carga tributária efetiva',  s2,18,d.rendaBruta>0?`${Math.round(cargaPct*100)}% do bruto`:'Sem dados'],
    ['Provisão 13º + férias',    s3,15,!hasPJ?'N/A':provOk?`${R(d.prov.total)}/mês`:hasPJ?'Configure pró-labore':''],
    ['Controle de gastos',        s4,15,d.rendaDisp>0?`${Math.round(expRatio*100)}% da renda`:''],
    ['Taxa de investimento',      s5,12,d.invests>0?`${Math.round(invRatio*100)}% investido`:'Nenhum'],
    ['Tendência de faturamento',  s6, 8,trendUp?'Crescendo ↗':trendDown?'Queda ↘':histFat.length>0?'Estável →':'Dados insuficientes'],
    ['Diversificação de renda',   s7,10,hasCLT&&hasPJ?'CLT + PJ':hasPJ?'Só PJ':hasCLT?'Só CLT':'Sem renda'],
  ];

  const prevGastos=avgGastos>0?avgGastos*(trendGastUp?1.05:.97):0;
  const prevFat   =avgFat>0?avgFat*(trendUp?1.05:trendDown?.95:1.0):0;

  const kpis=[
    {label:'Faturamento PJ',    val:R(d.fat),       sub:`Simples: ${R(d.simp.imposto)} (${(d.simp.aliq*100).toFixed(1)}%)`, color:'var(--acc)',  bg:'var(--acc2)',  bd:'var(--acc-b)'},
    {label:'Renda disponível',  val:R(d.rendaDisp), sub:hasCLT?`CLT ${Rk(d.cltL)} + PJ ${Rk(d.liquidoPJ)}`:'Após impostos e custos', color:'var(--green)',bg:'var(--green2)',bd:'var(--green-b)'},

function ImportCSVDrawer({ onImport, onClose }) {
  const [rows, setRows]     = React.useState([]);
  const [err, setErr]       = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [colInfo, setColInfo] = React.useState('');
  const [rowCats, setRowCats] = React.useState({});
  const fileRef = React.useRef(null);

  const handleFile = e => {
    setErr(''); setRows([]); setColInfo(''); setRowCats({});
    const file = e.target.files[0];
    if(!file) return;
    setLoading(true);
    const tryParse = (encoding, onFail) => {
      const reader = new FileReader();
      reader.onload = ev => {
        const text = ev.target.result;
        const parsed = parseNubankCSV(text);
        if(parsed===null){
          if(onFail) onFail(); else { setErr('Coluna de valor não encontrada. Verifique se é um extrato bancário válido.'); setLoading(false); }
          return;
        }
        if(parsed.length===0){
          if(onFail) onFail(); else { setErr('Nenhum lançamento encontrado no arquivo.'); setLoading(false); }
          return;
        }
        // Detect column info for display
        const lines=text.split(/\r?\n/).filter(Boolean);
        if(lines.length>0){
          const hdr=splitCSVLine(lines[0]);
          setColInfo('Detectado: '+hdr.join(' | ')+' ('+parsed.length+' lançamentos)');
        }
        const cats={};
        parsed.forEach(r=>{cats[r.id]=r.cat;});
        setRowCats(cats);
        setRows(parsed);
        setLoading(false);
      };
      reader.onerror = () => { if(onFail) onFail(); else { setErr('Erro ao ler o arquivo.'); setLoading(false); } };
      reader.readAsText(file, encoding);
    };
    tryParse('UTF-8', ()=>tryParse('ISO-8859-1', null));
  };

  const confirmImport = () => {
    const toImport = rows.map(r=>({...r,cat:rowCats[r.id]||r.cat}));
    onImport(toImport);
    onClose();
  };

  return React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:200,display:'flex',alignItems:'flex-end'}},
    React.createElement('div',{style:{background:'var(--card)',width:'100%',maxHeight:'85vh',borderRadius:'16px 16px 0 0',padding:20,overflowY:'auto'}},
      React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
        React.createElement('span',{style:{fontWeight:700,fontSize:15}},'📥 Importar CSV'),
        React.createElement('button',{onClick:onClose,style:{background:'none',border:'none',fontSize:18,cursor:'pointer',color:'var(--muted)'}}, '✕')
      ),
      err && React.createElement('div',{style:{background:'var(--red2)',border:'1px solid var(--red)',color:'var(--red)',padding:'8px 12px',borderRadius:8,marginBottom:12,fontSize:13}},err),
      colInfo && React.createElement('div',{style:{background:'var(--acc2)',border:'1px solid var(--acc-b)',color:'var(--acc)',padding:'6px 10px',borderRadius:6,marginBottom:10,fontSize:12}},colInfo),
      rows.length===0 && React.createElement('div',null,
        React.createElement('p',{style:{fontSize:13,color:'var(--muted)',marginBottom:14}},'Selecione um extrato .csv do seu banco. Nubank, Inter, C6, e outros formatos comuns são detectados automaticamente.'),
        React.createElement('div',{style:{border:'2px dashed var(--border2)',borderRadius:10,padding:'28px 16px',textAlign:'center',cursor:'pointer'},onClick:()=>fileRef.current&&fileRef.current.click()},
          React.createElement('div',{style:{fontSize:28,marginBottom:8}},'📂'),
          React.createElement('div',{style:{fontWeight:600,marginBottom:4}},'Clique para selecionar o arquivo'),
          React.createElement('div',{style:{fontSize:11,color:'var(--muted)'}},'Formatos: .csv separado por vírgula ou ponto e vírgula')
        ),
        React.createElement('input',{ref:fileRef,type:'file',accept:'.csv,text/csv',style:{display:'none'},onChange:handleFile})
      ),
      loading && React.createElement('div',{style:{textAlign:'center',padding:20,color:'var(--muted)'}},'Processando...'),
      rows.length>0 && React.createElement('div',null,
        React.createElement('div',{style:{marginBottom:10,fontSize:13,color:'var(--muted)'}},rows.length+' lançamentos encontrados. Ajuste as categorias se necessário:'),
        rows.map(r=>{
          const curCat=rowCats[r.id]||r.cat;
          const catObj=CATS.find(c=>c.id===curCat)||CATS[8];
          return React.createElement('div',{key:r.id,style:{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}},
            React.createElement('select',{value:curCat,onChange:ev=>setRowCats(p=>({...p,[r.id]:ev.target.value})),style:{fontSize:12,padding:'2px 4px',borderRadius:4,border:'1px solid var(--border2)',background:'var(--bg2)',color:'var(--text)'}},
              CATS.map(c=>React.createElement('option',{key:c.id,value:c.id},c.icon+' '+c.label))
            ),
            React.createElement('span',{style:{flex:1,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.label),
            React.createElement('span',{style:{fontSize:12,fontWeight:600,flexShrink:0}},'R$ '+n(r.value).toFixed(2).replace('.',','))
          );
        }),
        React.createElement('div',{style:{display:'flex',gap:8,marginTop:14}},
          React.createElement('button',{onClick:confirmImport,style:{flex:1,background:'var(--acc)',color:'#fff',border:'none',borderRadius:8,padding:'10px 0',fontWeight:700,cursor:'pointer',fontSize:13}},'✅ Importar '+rows.length+' lançamentos'),
          React.createElement('button',{onClick:onClose,style:{background:'var(--bg2)',color:'var(--text)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 16px',cursor:'pointer',fontSize:13}},'Cancelar')
        )
      )
    )
  );
}

// ── Tab: Analytics ────────────────────────────────────────────────────────────
function TabAnalytics({month,year,cltBruto,pjByYM,expByYM,invByYM}) {
  const barRef=useRef(null),doRef=useRef(null);
  const barChart=useRef(null),doChart=useRef(null);

  const months12=useMemo(()=>Array.from({length:12},(_,i)=>{
    let m=month-11+i,y=year; while(m<0){m+=12;y--;}
    const d=deriveMes(cltBruto,pjByYM,expByYM,invByYM,y,m);
    return {label:MONTHS[m],fat:d.fat,liquidoPJ:d.liquidoPJ,cltL:d.cltL,gastos:d.gastos,invests:d.invests};
  }),[month,year,cltBruto,pjByYM,expByYM,invByYM]);

  const d=deriveMes(cltBruto,pjByYM,expByYM,invByYM,year,month);
  const doData=[
    {label:'INSS CLT',            value:d.cltI,              color:'#818cf8'},
    {label:'IRPF CLT',            value:d.cltR,              color:'#a78bfa'},
    {label:'Simples Nacional',    value:d.simp.imposto,      color:'#f87171'},
    {label:'INSS + IRPF PJ',      value:d.inssPJ+d.irpfPJ,  color:'#fb923c'},
    {label:'Provisão 13+férias',  value:d.prov.total,        color:'#fbbf24'},
    {label:'Custos PJ',           value:d.dp,                color:'#f59e0b'},
    {label:'Gastos pessoais',     value:d.gastos,            color:'#60a5fa'},
    {label:'Investimentos',       value:d.invests,           color:'#34d399'},
    {label:'Sobra',               value:Math.max(d.sobra,0), color:'#10b981'},
  ].filter(x=>x.value>0);

  useEffect(()=>{
    if(!barRef.current) return;
    if(barChart.current) barChart.current.destroy();
    barChart.current=new Chart(barRef.current.getContext('2d'),{
      type:'bar',
      data:{
        labels:months12.map(m=>m.label),
        datasets:[
          {label:'Faturamento PJ', data:months12.map(m=>m.fat),       backgroundColor:'rgba(245,158,11,.25)',borderColor:'#f59e0b',borderWidth:1,borderRadius:3,stack:'a'},
          {label:'CLT líquido',    data:months12.map(m=>m.cltL),      backgroundColor:'rgba(129,140,248,.3)',borderColor:'#818cf8',borderWidth:1,borderRadius:3,stack:'a'},
          {label:'Gastos pessoais',data:months12.map(m=>m.gastos),    backgroundColor:'rgba(248,113,113,.3)',borderColor:'#f87171',borderWidth:1,borderRadius:3,stack:'b'},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#94a3b8',font:{size:11}}}},
        scales:{x:{ticks:{color:'#64748b'},grid:{color:'rgba(26,37,64,.8)'}},
          y:{ticks:{color:'#64748b',callback:v=>v>=1000?`${(v/1000).toFixed(0)}k`:v},grid:{color:'rgba(26,37,64,.8)'}}}}
    });
    return ()=>barChart.current?.destroy();
  },[months12]);

  useEffect(()=>{
    if(!doRef.current||doData.length===0) return;
    if(doChart.current) doChart.current.destroy();
    doChart.current=new Chart(doRef.current.getContext('2d'),{
      type:'doughnut',
      data:{labels:doData.map(x=>x.label),datasets:[{data:doData.map(x=>x.value),backgroundColor:doData.map(x=>x.color),borderWidth:0,hoverOffset:4}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:10},boxWidth:10,padding:8}}}}
    });
    return ()=>doChart.current?.destroy();
  },[doData]);

  // Comparativo CLT x PJ com mesmo valor
  const ref=d.rendaBruta>0?d.rendaBruta:0;
  const cltSI=calcINSS(ref),cltSR=calcIRPF(ref-cltSI),cltSL=ref-cltSI-cltSR;
  const pjSS=calcSimples(ref),pjSInss=calcINSSPJ(ref*.28),pjSIr=calcIRPF(ref*.28-pjSInss),pjSProv=calcProvisoes(ref*.28).total;
  const pjSL=ref-pjSS.imposto-pjSInss-pjSIr-pjSProv;
  const diff=pjSL-cltSL;

  // Anual: últimos 12 meses
  const totalFat=months12.reduce((s,m)=>s+m.fat,0);
  const totalLiq=months12.reduce((s,m)=>s+m.liquidoPJ+m.cltL,0);
  const totalGas=months12.reduce((s,m)=>s+m.gastos,0);
  const totalInv=months12.reduce((s,m)=>s+m.invests,0);

  return React.createElement('div',null,
    // Resumo anual
    React.createElement('div',{className:'card',style:{background:'rgba(245,158,11,.05)',border:'1px solid var(--acc-b)',marginBottom:12}},
      React.createElement('div',{style:{fontWeight:700,fontSize:14,marginBottom:10}},'📅 Visão anual (últimos 12 meses)'),
      React.createElement('div',{className:'grid2'},
        [{label:'Faturamento PJ',val:R(totalFat),color:'var(--acc)'},{label:'Renda líquida',val:R(totalLiq),color:'var(--green)'},
         {label:'Gastos pessoais',val:R(totalGas),color:'var(--red)'},{label:'Investimentos',val:R(totalInv),color:'var(--blue)'}
        ].map(({label,val,color})=>
          React.createElement('div',{key:label,style:{textAlign:'center',padding:'10px',background:'var(--s2)',borderRadius:8}},
            React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:4}},label),
            React.createElement('div',{style:{fontSize:16,fontWeight:800,color}},val)
          )
        )
      )
    ),

    // Bar chart
    React.createElement('div',{className:'card'},
      React.createElement('div',{style:{fontWeight:700,fontSize:14,marginBottom:12}},'📊 Faturamento × Gastos (12 meses)'),
      React.createElement('div',{style:{height:220}},React.createElement('canvas',{ref:barRef}))
    ),

    // Doughnut
    d.rendaBruta>0&&React.createElement('div',{className:'card'},
      React.createElement('div',{style:{fontWeight:700,fontSize:14,marginBottom:12}},`🍕 Destino da renda — ${MONTHS_F[month]}`),
      React.createElement('div',{style:{height:200}},React.createElement('canvas',{ref:doRef}))
    ),

    // CLT vs PJ
    ref>0&&React.createElement('div',{className:'card'},
      React.createElement('div',{style:{fontWeight:700,fontSize:14,marginBottom:6}},'⚖️ CLT × PJ — mesmo valor bruto'),
      React.createElement('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:12}},
        `Se ${R(ref)} viesse inteiro como CLT vs como PJ (pró-labore 28%, sem custos)`),
      React.createElement('div',{className:'grid2'},
        React.createElement('div',{className:'kpi',style:{background:'var(--clt2)',border:'1px solid var(--clt-b)'}},
          React.createElement('div',{className:'lbl',style:{color:'var(--clt)'}},'👔 Só CLT'),
          React.createElement('div',{className:'val',style:{color:'var(--clt)'}},R(cltSL)),
          React.createElement('div',{className:'sub'},`INSS+IRPF: ${R(cltSI+cltSR)} (${Math.round((cltSI+cltSR)/Math.max(ref,1)*100)}%)`)
        ),
        React.createElement('div',{className:'kpi',style:{background:'var(--acc2)',border:'1px solid var(--acc-b)'}},
          React.createElement('div',{className:'lbl',style:{color:'var(--acc)'}},'🏢 Só PJ'),
          React.createElement('div',{className:'val',style:{color:'var(--acc)'}},R(pjSL)),
          React.createElement('div',{className:'sub'},`Simples+INSS+IRPF+Prov: ${R(pjSS.imposto+pjSInss+pjSIr+pjSProv)} (${Math.round((pjSS.imposto+pjSInss+pjSIr+pjSProv)/Math.max(ref,1)*100)}%)`)
        )
      ),
      React.createElement('div',{style:{textAlign:'center',padding:'10px 0 2px',borderTop:'1px solid var(--border)'}},
        React.createElement('span',{style:{fontSize:13,fontWeight:700,color:diff>=0?'var(--green)':'var(--blue)'}},
          diff>=0?`✅ PJ gera ${R(diff)} a mais`:`👔 CLT geraria ${R(Math.abs(diff))} a mais`)
      )
    )
  );
}

// ── FloatingChat ──────────────────────────────────────────────────────────────
function FloatingChat({month,year,cltBruto,pjByYM,expByYM,invByYM,metas}) {
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[msgs]);

  const buildCtx=()=>{
    const d=deriveMes(cltBruto,pjByYM,expByYM,invByYM,year,month);
    const metasStr=metas.map(m=>`${m.label}: ${Math.round(n(m.atual)/Math.max(n(m.alvo),1)*100)}%`).join(', ')||'nenhuma';
    return `Você é um assistente financeiro especializado em trabalhadores PJ e autônomos brasileiros. Responda em português, seja direto e use os dados reais do usuário.

      React.createElement('div',{style:{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,rgba(245,158,11,.1),transparent)'}},
        React.createElement('div',{style:{fontSize:20}},'✨'),
        React.createElement('div',null,
          React.createElement('div',{style:{fontWeight:700,fontSize:13}},'Sovra IA — PJ'),
          React.createElement('div',{style:{fontSize:11,color:'var(--green)'}},'● Online — especialista em PJ')
        )

      React.createElement('div',{style:{flex:1,overflowY:'auto',padding:12,display:'flex',flexDirection:'column',gap:8}},
        msgs.length===0&&React.createElement('div',null,

        ),
        msgs.map((m,i)=>React.createElement('div',{key:i,style:{maxWidth:'85%',padding:'8px 12px',borderRadius:12,fontSize:12,lineHeight:1.5,

        React.createElement('div',{ref:endRef})
      ),
      React.createElement('div',{style:{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',gap:8}},
        React.createElement('input',{value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==='Enter'&&send(),
          placeholder:'Pergunte algo sobre PJ...',style:{flex:1,fontSize:12,padding:'7px 10px',borderRadius:8}}),
        React.createElement('button',{onClick:()=>send(),style:{background:'var(--acc)',border:'none',color:'#000',borderRadius:8,padding:'7px 14px',fontSize:12,fontWeight:700}},'→')
      )
    )
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]           = useState('inicio');
  const [month,setMonth]       = useState(today.getMonth());
  const [year,setYear]         = useState(today.getFullYear());
  const [cltBruto,setCltBruto] = useState('');
  const [pjByYM,setPjByYM]     = useState({});
  const [expByYM,setExpByYM]   = useState({});
  const [invByYM,setInvByYM]   = useState({});
  const [metas,setMetas]       = useState([]);
  const [toast,setToast]       = useState('');

  useEffect(()=>{
    try {
      const d=JSON.parse(localStorage.getItem('sovra_pj_v1')||'{}');
      if(d.cltBruto!==undefined) setCltBruto(d.cltBruto);
      if(d.pjByYM)  setPjByYM(d.pjByYM);
      if(d.expByYM) setExpByYM(d.expByYM);
      if(d.invByYM) setInvByYM(d.invByYM);
      if(d.metas)   setMetas(d.metas);
    } catch(e){}
  },[]);

  const skip=useRef(true);
  useEffect(()=>{
    if(skip.current){skip.current=false;return;}
    try{localStorage.setItem('sovra_pj_v1',JSON.stringify({cltBruto,pjByYM,expByYM,invByYM,metas}));}catch(e){}
  },[cltBruto,pjByYM,expByYM,invByYM,metas]);

  const onPrev=useCallback(()=>{if(month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1);},[month]);
  const onNext=useCallback(()=>{if(month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1);},[month]);

  const doExport=()=>{
    const blob=new Blob([JSON.stringify({cltBruto,pjByYM,expByYM,invByYM,metas},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sovra_pj_backup.json'; a.click();
    setToast('✅ Backup exportado!'); setTimeout(()=>setToast(''),3000);
  };

  const TABS=[{id:'inicio',label:'🏠 Início'},{id:'mensal',label:'💼 Mensal'},{id:'analytics',label:'📊 Analytics'},{id:'metas',label:'🎯 Metas'}];
  const p={month,year,onPrev,onNext,cltBruto,setCltBruto,pjByYM,setPjByYM,expByYM,setExpByYM,invByYM,setInvByYM,metas,setMetas,setTab};

  return React.createElement('div',null,
    React.createElement('div',{className:'top-bar'},
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10}},
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:18,fontWeight:900,letterSpacing:'-.04em',lineHeight:1}},'Sovra'),
          React.createElement('div',{style:{fontSize:9,color:'var(--muted)',letterSpacing:'.04em'}},'by Sovra Labs')
        ),
        React.createElement('span',{style:{background:'linear-gradient(135deg,#f59e0b,#d97706)',color:'#000',borderRadius:4,padding:'2px 8px',fontSize:10,fontWeight:800,letterSpacing:'.05em'}},'PJ')
      ),
      React.createElement('button',{onClick:doExport,
        style:{background:'var(--s2)',border:'1px solid var(--border)',color:'var(--muted)',borderRadius:6,padding:'6px 12px',fontSize:11,fontWeight:600}},'⬇ Export')
    ),
    React.createElement('div',{className:'tabs-wrap'},
      React.createElement('div',{className:'tabs'},
        TABS.map(t=>React.createElement('button',{key:t.id,className:`tab${tab===t.id?' active':''}`,onClick:()=>setTab(t.id)},t.label))
      )
    ),
    React.createElement('div',{className:'main'},
      tab==='inicio'    && React.createElement(TabInicio,    {...p}),
      tab==='mensal'    && React.createElement(TabMensal,    {...p}),
      tab==='analytics' && React.createElement(TabAnalytics, {...p}),
      tab==='metas'     && React.createElement(TabMetas,     {...p}),
    ),
    React.createElement(FloatingChat,{month,year,cltBruto,pjByYM,expByYM,invByYM,metas}),
    toast&&React.createElement('div',{className:'toast'},toast)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
